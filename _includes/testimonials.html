<h2 class="m0a" data-aos="fade-up">Testimonials:</h2>
<p class="m0">
  <small>
    Recommendations from
    <a href="{{ site.data.main.social.linkedin.link }}">LinkedIn</a> — select one to read it.
  </small>
</p>
<div class="testimonials py-3">
  {% for item in site.data.testimonials %}
  <details class="testimonial borders cards rounded" data-aos="fade-up">
    <summary>
      <span class="name">{{ item.name }}</span>
      {% if item.title %}<span class="role">{{ item.title }}</span>{% endif %}
      {% if item.date %}<span class="date">{{ item.date }}</span>{% endif %}
    </summary>
    <p class="review">
      <i class="fas fa-quote-left"></i>
      {{ item.review }}
      <i class="fas fa-quote-right"></i>
    </p>
  </details>
  {% endfor %}
</div>
